name: Setup project
description: Install pnpm 10, Node.js 22 and the locked dependencies

runs:
    using: composite
    steps:
        - name: Install pnpm
          uses: pnpm/action-setup@v4
          with:
              version: 10
              run_install: false

        - name: Install Node.js
          uses: actions/setup-node@v4
          with:
              node-version: 22
              cache: 'pnpm'

        - name: Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile
